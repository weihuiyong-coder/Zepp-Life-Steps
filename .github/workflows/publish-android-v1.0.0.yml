name: Publish Android v1.0.0

"on":
  push:
    branches: [feature/android-apk-20260918]
    paths: [.github/workflows/publish-android-v1.0.0.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-android-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'weihuiyong-coder/Zepp-Life-Steps' && github.ref == 'refs/heads/feature/android-apk-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      REPO: weihuiyong-coder/Zepp-Life-Steps
      TAG: android-v1.0.0
      SOURCE: 929e5cb8d10ba7da30755f22b1779257b61c27e3
    steps:
      - name: Download original unsigned build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/10553380704/zip" > build.zip

      - name: Restore exactly the delivered signed APK without a private key
        shell: python
        run: |
          import base64, hashlib, io, zipfile, zlib
          from pathlib import Path
          # This public delta contains only bytes from the already signed APK.
          # It is NOT a signing key and cannot sign any modified application.
          # The original build artifact is required for this one-time publication.
          delta = ""
          expected = "f2da1d92acb857a18623e7e2269fb9934187ab2414646d3adf54c816e35bc856"
          archive = Path("build.zip").read_bytes()
          if hashlib.sha256(archive).hexdigest() != "d8edd5b64bfc45ba0caac8c1d9efe77f44baeba36b9daae903e02d1636f86b13":
              raise RuntimeError("Original build artifact checksum mismatch")
          out = Path("dist")
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              base = z.read("ZeppSteps-1.0.0-unsigned.apk")
              if hashlib.sha256(base).hexdigest() != "b4de82bde4871180e6117cef517e7dc50160dc87493f5dbddc00b505187e54be":
                  raise RuntimeError("Unsigned APK checksum mismatch")
              decoder = zlib.decompressobj(zdict=base)
              apk = decoder.decompress(base64.b64decode(delta, validate=True)) + decoder.flush()
              if not decoder.eof or len(apk) != 41819 or hashlib.sha256(apk).hexdigest() != expected:
                  raise RuntimeError("Delivered APK checksum mismatch")
              with zipfile.ZipFile(io.BytesIO(apk)) as package:
                  if package.testzip() is not None:
                      raise RuntimeError("APK archive CRC check failed")
              (out / "ZeppSteps-1.0.0.apk").write_bytes(apk)
              Path("apksigner.jar").write_bytes(z.read("apksigner.jar"))
              report = "Zepp Steps Android 1.0.0 - verification report\n"
              report += "Source: 929e5cb8d10ba7da30755f22b1779257b61c27e3\n"
              report += "APK SHA256: " + expected + "\n"
              report += "The published APK is byte-for-byte identical to the delivered signed APK.\n"
              report += "No emulator/device or real-account test has been performed. WeChat sync is unverified.\n\n"
              for filename in ("build-report.txt", "tests.txt", "package-info.txt", "zipalign.txt"):
                  report += "--- " + filename + " ---\n" + z.read(filename).decode("utf-8") + "\n"
              (out / "ZeppSteps-1.0.0-TestReport.txt").write_text(report, encoding="utf-8")
          print("Verified original signed APK:", expected)

      - name: Verify signature and prepare public documentation
        run: |
          set -euo pipefail
          java -jar apksigner.jar verify --verbose --print-certs dist/ZeppSteps-1.0.0.apk | tee signature.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 2d2aff952dde6d43fd7a4213dbad3281f02d6e13f1259a0a1ea425a1721ccba0' signature.txt
          cat signature.txt >> dist/ZeppSteps-1.0.0-TestReport.txt
          cat > dist/README-Android.md <<'NOTES'
          # Zepp步数助手 Android v1.0.0（测试版）

          安卓手机独立运行，不需要电脑、Termux、Root 或自建服务器。最低支持 Android 8.0（API 26）；需要联网。

          ## 下载与使用
          下载本页面 Assets 中的 `ZeppSteps-1.0.0.apk` 并在安卓手机安装。
          输入与电脑版相同的 Zepp Life 手机号／邮箱和密码，**不是微信密码**。
          可先点击“验证登录”（不修改步数），再输入今天的目标总步数并确认提交。
          日期按北京时间当天计算，输入的是目标总步数，不是追加步数。
          需要先在官方 Zepp Life 中绑定微信运动；“Zepp 已接受”不等于微信已经同步，请在微信运动中确认。

          ## 数据与安全
          账号密码默认不保存；主动选择保存时，使用 Android Keystore + AES-256-GCM 在本机加密。
          本次发布不包含私有签名密钥、签名密码、个人账号、登录令牌或私人维护备份。
          本工具不是 Zepp／微信官方产品，仅用于自己的账号；不要用于竞赛、保险或奖励等依赖真实运动数据的活动。

          ## 验证情况与限制
          编译、35 项模拟检查、APK 签名与文件完整性校验通过。
          **尚未进行安卓模拟器或实体手机运行测试，也未使用真实账号验证登录、步数提交及微信同步，因此标记为测试版。**
          第三方接口可能变化、触发验证码或限流。反馈问题时请遮盖账号，不要提供密码或令牌。
          详细结果见 `ZeppSteps-1.0.0-TestReport.txt`；校验值见 `SHA256SUMS.txt`。

          包名：`com.weihuiyong.zeppsteps`；版本：`1.0.0`（versionCode 10000）。
          源码提交：`929e5cb8d10ba7da30755f22b1779257b61c27e3`。
          APK SHA-256：`f2da1d92acb857a18623e7e2269fb9934187ab2414646d3adf54c816e35bc856`。

          Android 使用独立标签 `android-v1.0.0`，不覆盖 Windows 版 `v1.0.0`。本次未修改 Windows 程序或 main 分支。
          NOTES
          (cd dist && sha256sum ZeppSteps-1.0.0.apk ZeppSteps-1.0.0-TestReport.txt README-Android.md > SHA256SUMS.txt)

      - name: Publish isolated Android prerelease and verify the uploaded APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite existing assets.' >&2
            exit 1
          fi
          gh release create "$TAG" dist/ZeppSteps-1.0.0.apk dist/ZeppSteps-1.0.0-TestReport.txt dist/README-Android.md dist/SHA256SUMS.txt \
            --repo "$REPO" --target "$SOURCE" --draft --prerelease --latest=false \
            --title 'Android v1.0.0 · Zepp步数助手（测试版）' --notes-file dist/README-Android.md
          mkdir -p downloaded
          gh release download "$TAG" --repo "$REPO" --pattern 'ZeppSteps-1.0.0.apk' --dir downloaded
          echo 'f2da1d92acb857a18623e7e2269fb9934187ab2414646d3adf54c816e35bc856  downloaded/ZeppSteps-1.0.0.apk' | sha256sum -c -
          gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false
          gh release view "$TAG" --repo "$REPO" --json url,isDraft,isPrerelease,assets
