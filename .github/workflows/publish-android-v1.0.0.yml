name: Publish Android v1.0.0

"on":
  push:
    branches: [feature/android-apk-20260918]
    paths: [.github/workflows/publish-android-v1.0.0.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-android-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'weihuiyong-coder/Zepp-Life-Steps' && github.ref == 'refs/heads/feature/android-apk-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      REPO: weihuiyong-coder/Zepp-Life-Steps
      TAG: android-v1.0.0
      SOURCE: 929e5cb8d10ba7da30755f22b1779257b61c27e3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retrieve immutable build and archived public delivery manifest
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/10553380704/zip" > build.zip
          gh api "repos/$REPO/git/blobs/7435828f275de1d0267afb32d17bb5839ee921ea" --jq .content | base64 --decode > delivery.yml

      - name: Verify, restore, sign-check, publish and download-check original APK
        shell: python
        run: |
          import hashlib, re, subprocess, sys, textwrap
          from pathlib import Path
          # One-time publication of the existing signed package, not a new build.
          # The archived delta contains APK bytes only; no signing private key.
          raw = Path('delivery.yml').read_bytes()
          def git_blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          if git_blob(raw) != '7435828f275de1d0267afb32d17bb5839ee921ea':
              raise RuntimeError('Archived delivery manifest has changed')
          text = raw.decode('utf-8')
          before = 'GgICAgICAgICAgICAgICAgICMj'
          after = 'GgICAgICAgICAgICAgICMj'
          if text.count(before) != 1:
              raise RuntimeError('Expected one encoding correction')
          text = text.replace(before, after, 1)
          if git_blob(text.encode()) != '72ef757a4fa2a5e716f27fe05fe30758caef4dbf':
              raise RuntimeError('Corrected manifest does not match the locally tested manifest')
          scripts = [textwrap.dedent(m.group(1)) for m in re.finditer(r'^        run: \|\n((?:          .*\n|\n)*)', text, re.M)]
          if len(scripts) != 4:
              raise RuntimeError('Unexpected manifest structure')
          for index in (1, 2, 3):
              command = [sys.executable, '-'] if index == 1 else ['bash', '-e', '-o', 'pipefail']
              subprocess.run(command, input=scripts[index], text=True, check=True)
